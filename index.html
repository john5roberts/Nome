<!doctype html>

  <title>Nome</title>

  <style>
    :root {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color-scheme: dark;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #111;
      color: #fff;
    }

    .app {
      width: min(92vw, 520px);
      margin: 0 auto;
      padding: 28px 0 36px;
      text-align: center;
    }

    h1 {
      margin: 0 0 34px;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .title-row {
      position: relative;
      margin-bottom: 34px;
    }

    .title-row h1 { margin: 0; }

    .measure-clock {
      position: relative;
      isolation: isolate;
      width: min(70vw, 290px);
      aspect-ratio: 1;
      margin: 0 auto;
      border: 1px solid rgba(255,255,255,.34);
      border-radius: 50%;
      background: #161616;
      overflow: visible;
    }

    /* Preserved SimpleLoop count-in visual language for future optional use. */
    .countin-quadrant {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: #414141;
      opacity: 0;
      pointer-events: none;
      z-index: 1;
      transition: opacity 80ms linear;
    }

    .measure-clock.counting-in .countin-quadrant { opacity: 1; }
    .measure-clock.counting-in .countin-quadrant.done { opacity: 0; }
    .q1 { clip-path: polygon(50% 50%, 50% 0%, 100% 0%, 100% 50%); }
    .q2 { clip-path: polygon(50% 50%, 100% 50%, 100% 100%, 50% 100%); }
    .q3 { clip-path: polygon(50% 50%, 50% 100%, 0% 100%, 0% 50%); }
    .q4 { clip-path: polygon(50% 50%, 0% 50%, 0% 0%, 50% 0%); }

    /* Measure dividers: beat 1 at 12 o'clock, then clockwise. */
    .beat-line {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 1px;
      height: 50%;
      background: rgba(255,255,255,.28);
      transform-origin: 50% 0%;
      pointer-events: none;
      z-index: 5;
      transition: background 70ms linear, box-shadow 70ms linear;
    }

    .beat-line-1 {
      transform: rotate(180deg);
      background: rgba(255,255,255,.34);
    }

    .beat-line.flash {
      width: 2px;
      background: #fff;
      box-shadow:
        0 0 7px rgba(255,255,255,.95),
        0 0 14px rgba(255,255,255,.72);
    }

    /* Beat 1 also flashes the circular boundary inward. */
    .measure-clock.downbeat-circle-flash {
      border-color: rgba(255,255,255,.88);
      box-shadow:
        inset 0 0 0 2px rgba(255,255,255,.82),
        inset 0 0 16px rgba(255,255,255,.72),
        inset 0 0 30px rgba(255,255,255,.45);
    }

    /* Sweeping measure hand. Hidden while idle. */
    .clock-hand {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 5px;
      height: 50%;
      background: linear-gradient(
        to top,
        rgba(255,255,255,.95) 0%,
        rgba(255,255,255,.92) 25%,
        rgba(255,255,255,.72) 70%,
        rgba(255,255,255,.38) 100%
      );
      clip-path: polygon(30% 100%, 70% 100%, 56% 0%, 44% 0%);
      transform-origin: 50% 100%;
      transform: translate(-50%, -100%) rotate(0deg);
      pointer-events: none;
      z-index: 5;
      opacity: 0;
      transition: opacity 70ms linear;
      will-change: transform;
    }

    .clock-hand.visible { opacity: 1; }

    /* Same central circular control scale as SimpleLoop, adapted to Play / Stop. */
    #metronomeToggle {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 82px;
      height: 82px;
      margin: 0;
      padding: 0;
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 50%;
      background: #f3f3f5;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.35);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      pointer-events: auto;
      touch-action: manipulation;
      -webkit-appearance: none;
      appearance: none;
      -webkit-tap-highlight-color: transparent;
    }

    .play-symbol {
      width: 0;
      height: 0;
      margin-left: 5px;
      border-top: 17px solid transparent;
      border-bottom: 17px solid transparent;
      border-left: 27px solid #36c46b;
    }

    #metronomeToggle.running .play-symbol {
      width: 34px;
      height: 34px;
      margin-left: 0;
      border: 0;
      border-radius: 9px;
      background: #333;
    }

    .info-toggle,
    .settings-toggle {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 30px;
      height: 30px;
      padding: 0;
      border: 1px solid rgba(255,255,255,.45);
      border-radius: 50%;
      background: transparent;
      color: rgba(255,255,255,.78);
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-appearance: none;
      appearance: none;
      touch-action: manipulation;
    }

    .settings-toggle {
      left: 2px;
      font-size: 18px;
    }

    .info-toggle {
      right: 2px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 20px;
      font-weight: 700;
    }

    .info-toggle.active,
    .settings-toggle.active {
      color: #fff;
      border-color: rgba(255,255,255,.9);
      background: rgba(255,255,255,.10);
    }

    .settings-toggle.active {
      color: #fff !important;
      border-color: #fff !important;
      background: rgba(255,255,255,.18) !important;
      box-shadow: 0 0 10px rgba(255,255,255,.28);
    }

    .control-help {
      position: absolute;
      left: 50%;
      top: calc(50% + 94px);
      width: min(76vw, 250px);
      transform: translateX(-50%);
      padding: 8px 10px;
      border-radius: 10px;
      background: rgba(20,20,20,.94);
      border: 1px solid rgba(255,255,255,.18);
      color: rgba(255,255,255,.90);
      font-size: 13px;
      line-height: 1.3;
      text-align: center;
      z-index: 1200;
      pointer-events: none;

    .control-help[hidden],
    .settings-popup[hidden] { display: none; }

    .settings-popup {
      position: relative;
      width: min(82vw, 320px);
      margin: 34px auto 0;
      padding: 0 0 max(22px, env(safe-area-inset-bottom));
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      overflow: visible;
    }

    .tempo-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      align-items: center;
      margin-bottom: 12px;
    }

    .tempo-step {
      width: 48px;
      height: 44px;
      padding: 0;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 12px;
      background: rgba(255,255,255,.06);
      color: #fff;
      font-size: 28px;
      line-height: 1;
      -webkit-appearance: none;
      appearance: none;
      touch-action: manipulation;
    }

    .tempo-value-wrap {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 7px;
    }

    .tempo-value {
      width: 82px;
      padding: 6px 8px;
      border: 0;
      border-radius: 8px;
      background: rgba(255,255,255,.06);
      color: #fff;
      text-align: center;
      font-size: 28px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      -webkit-appearance: none;
      appearance: textfield;
    }

    .tempo-value::-webkit-inner-spin-button,
    .tempo-value::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .tempo-unit {
      color: rgba(255,255,255,.60);
      font-size: 13px;
      letter-spacing: .04em;
    }

    .tempo-slider,
    .metronome-volume-slider {
      width: 100%;
      accent-color: #fff;
    }

    .time-signature-section,
    .metronome-volume-section {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid rgba(255,255,255,.14);
    }

    .settings-label {
      margin-bottom: 9px;
      color: rgba(255,255,255,.68);
      font-size: 13px;
      text-align: center;
    }

    .time-signature-choices {
      display: flex;
      justify-content: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .time-signature-choice {
      min-width: 45px;
      height: 36px;
      padding: 0 9px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 9px;
      background: rgba(255,255,255,.05);
      color: rgba(255,255,255,.72);
      font-size: 15px;
    }

    .time-signature-choice.selected {
      border-color: rgba(255,255,255,.9);
      background: rgba(255,255,255,.16);
      color: #fff;
    }

    .metronome-volume-row {
      display: grid;
      grid-template-columns: 1fr 48px;
      align-items: center;
      gap: 10px;
    }

    .metronome-volume-value {
      color: rgba(255,255,255,.72);
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }
  
    /* Unified control typography. */
    .controls-panel,
    .controls-panel button,
    .controls-panel input,
    .settings-label,
    .tempo-value,
    .tempo-unit,
    .time-signature-choice,
    .metronome-volume-value {
      font-size: 16px !important;
    }


    /* BPM value emphasis. */
    .tempo-value-wrap {
      justify-content: center !important;
      width: 100%;
    }
    .tempo-value {
      font-size: 20.8px !important;
      text-align: center !important;
      margin-left: auto !important;

    /* Clean, truly centered BPM readout. */
    .tempo-value-wrap {

    .tempo-value {

    .tempo-unit {

    /* Drum rhythm selector. */
    .time-signature-choices {
      flex-wrap: nowrap !important;
      align-items: center;
    }

    .drum-rhythm-button {
      width: 36px;
      min-width: 36px;
      height: 36px;
      padding: 0;

    .drum-rhythm-button svg {

    }

    .rhythm-picker {
      margin-top: 10px;
      width: 100%;
    }

    .rhythm-picker[hidden] {
      display: none;
    }

    .rhythm-select {
      width: 100%;
      min-height: 44px;
      padding: 0 38px 0 12px;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 9px;
      background: #1b1b1b;
      color: #fff;
      font: inherit;
      font-size: 16px;
      -webkit-appearance: menulist;
      appearance: auto;
    }

    @media (max-width: 390px) {
      .time-signature-choices {

        min-width: 40px;

      }

      .drum-rhythm-button {
        width: 34px;
        min-width: 34px;
      }
    }

    let chordTransitionBusy = false;

    function chordLaneActive() {
      const id = selectedRhythmBySignature['4/4'];
      return currentTimeSignature === '4/4' && (id === 'rock' || id === 'four-floor' || id === 'funk');
    }



    function eventAtBeat(song, absoluteBeatPosition) {
      const beat = ((absoluteBeatPosition % song.totalBeats) + song.totalBeats) % song.totalBeats;
      let active = song.events[0];

      for (const event of song.events) {
        if (event.startBeat <= beat) active = event;
        else break;
      }

      return active;
    }

    function upcomingEvents(song, absoluteBeatPosition, windowBeats = 8) {
      const beat = ((absoluteBeatPosition % song.totalBeats) + song.totalBeats) % song.totalBeats;
      const results = [];

      for (let cycle = 0; cycle < 2; cycle++) {
        const offset = cycle * song.totalBeats;

        for (const event of song.events) {
          const start = event.startBeat + offset;
          const distance = start - beat;

          if (cycle === 0 && distance <= 0) continue;

          if (distance > 0 && distance <= windowBeats) {
            results.push({ ...event, beatsAway: distance });
          }
        }
      }

      return results.sort((a, b) => a.beatsAway - b.beatsAway);
    }

    function song2EventAtBeat(absoluteBeatPosition) {
      const beat = ((absoluteBeatPosition % SONG2.totalBeats) + SONG2.totalBeats) % SONG2.totalBeats;
      let active = SONG2.events[0];
      for (const event of SONG2.events) {
        if (event.startBeat <= beat) active = event;
        else break;
      }
      return active;
    }

    function song2UpcomingEvents(absoluteBeatPosition, windowBeats = 8) {
      const beat = ((absoluteBeatPosition % SONG2.totalBeats) + SONG2.totalBeats) % SONG2.totalBeats;
      const results = [];

      for (let cycle = 0; cycle < 2; cycle++) {
        const offset = cycle * SONG2.totalBeats;
        for (const event of SONG2.events) {
          const start = event.startBeat + offset;
          let distance = start - beat;
          if (cycle === 0 && distance <= 0) continue;
          if (distance > 0 && distance <= windowBeats) {
            results.push({...event, beatsAway: distance});
          }
        }
      }
      return results.sort((a,b) => a.beatsAway - b.beatsAway);
    }

    function displaySong2SectionName(section) {
      return section;
    }

    function chordAt(index) {
      const n = SONG_MEASURES.length;
      return SONG_MEASURES[((index % n) + n) % n];
    }



    function displaySectionName(index) {
      const raw = chordAt(index).section;
      let occurrence = 1;

      // Count prior entrances into this section name.
      for (let i = 1; i <= index; i++) {
        if (chordAt(i).section === raw && chordAt(i - 1).section !== raw) {
          occurrence++;
        }
      }

      // Number repeated structural sections such as Verse 1 / Verse 2.
      const totalEntrances = SONG_MEASURES.reduce((count, m, i) => {
        if (m.section === raw && (i === 0 || SONG_MEASURES[i - 1].section !== raw)) {
          return count + 1;
        }
        return count;
      }, 0);

      return totalEntrances > 1 ? `${raw} ${occurrence}` : raw;
    }

    function nextSectionEntranceInfo(currentIndex, absoluteBeatPosition) {
      const currentSection = chordAt(currentIndex).section;

      // Find the first chord/measure of the next section.
      for (let step = 1; step <= SONG_MEASURES.length; step++) {
        const idx = (currentIndex + step) % SONG_MEASURES.length;
        const candidate = chordAt(idx);

        if (candidate.section !== currentSection) {
          // Use the exact same beat-distance basis as the chord runway.
          const currentAbsoluteMeasure = Math.floor(
            absoluteBeatPosition / beatsPerMeasure
          );
          const targetAbsoluteBeat =
            (currentAbsoluteMeasure + step) * beatsPerMeasure;

          return {
            index: idx,
            section: candidate.section,
            beatsAway: targetAbsoluteBeat - absoluteBeatPosition
          };
        }
      }

      return null;
    }

    function runwayLeftForBeatsAway(beatsAway) {
      if (beatsAway < 1 || beatsAway > 8) return null;
      return ((beatsAway - 1) / 7) * 100;

    function renderChordLane(index = 0, absoluteBeatPosition = 0) {
      if (!chordLaneActive()) {

      // This helper makes the visual model beat-based so shorter chord
      // durations can be introduced later without changing the runway concept.

          upcomingChordRunway.appendChild(label);
        });
        return;

      const currentAbsoluteBeat = Math.floor(absoluteBeatPosition);
      const currentMeasureIndex =
        Math.floor(currentAbsoluteBeat / beatsPerMeasure) % SONG_MEASURES.length;

        const beatsAway = chordStartBeat - currentAbsoluteBeat;

        if (beatsAway < 1 || beatsAway > 8) continue;

        const measure = chordAt(songIndex);
        const label = document.createElement('div');
        label.className = 'runway-chord';
        label.textContent = measure.chord;

        const pct = ((beatsAway - 1) / 7) * 100;
        label.style.left = `${pct}%`;
        upcomingChordRunway.appendChild(label);
      }
    }

    function sectionBoundaryInfo(visualIndex, absoluteBeatPosition) {
      const currentSection = chordAt(visualIndex).section;
      const currentMeasureStartBeat =

      for (let step = 1; step <= SONG_MEASURES.length; step++) {
        const idx = (visualIndex + step) % SONG_MEASURES.length;

        if (candidate.section !== currentSection) {
          return {
            nextIndex: idx,
            nextSection: candidate.section,
            beatsUntil:
              currentMeasureStartBeat +
              step * beatsPerMeasure -
              absoluteBeatPosition
          };
        }
      }

      return null;
    }

    function incomingTitleXForBeatsAway(beatsAway) {
      const discrete = Math.max(1, Math.min(8, Math.ceil(beatsAway)));
      const pct = ((discrete - 1) / 7) * 100;
      return 42 + (pct / 100) * 58;
    }

    function startChordLaneAnimation(firstBeatTime) {
      stopChordLaneAnimation();

      chordLaneAnchorTime = firstBeatTime;
      chordLaneVisualIndex = 0;
      chordLaneLastBeat = -1;

      renderChordLane(0, 0);
      renderUpcomingRunway(0);

      incomingSectionLabel.textContent = '';
      incomingSectionLabel.className = 'incoming-section-label';
      incomingSectionLabel.style.left = '100%';

      const animate = () => {
        if (!running || !audioContext || !chordLaneActive() || chordLaneAnchorTime == null) {
          chordLaneAnimationFrame = null;
          return;
        }

        const elapsed = audioContext.currentTime - chordLaneAnchorTime;

        if (elapsed < 0) {
          chordLaneAnimationFrame = requestAnimationFrame(animate);
          return;
        }

        const beatDur = secondsPerBeat();
        const absoluteBeatPosition = elapsed / beatDur;
        const absoluteBeat = Math.floor(absoluteBeatPosition);

        if (secondSongActive() || thirdSongActive()) {
          const activeSong = secondSongActive() ? SONG2 : SONG3;
          const currentEvent = eventAtBeat(activeSong, absoluteBeatPosition);
          currentChordLabel.textContent = currentEvent.chord;

          if (absoluteBeat !== chordLaneLastBeat) {
            chordLaneLastBeat = absoluteBeat;
            renderUpcomingRunway(absoluteBeatPosition);
          }

          // Section-title behavior for Song 2
          const currentSection = currentEvent.section;
          if (songSectionLabel.dataset.section !== currentSection) {
            songSectionLabel.textContent = currentSection;
            songSectionLabel.dataset.section = currentSection;
            songSectionLabel.style.opacity = '1';
            incomingSectionLabel.textContent = '';
            incomingSectionLabel.className = 'incoming-section-label';
            incomingSectionLabel.style.left = '100%';
          }

          // Find first event of next section and its beat distance.
          const beat = ((absoluteBeatPosition % activeSong.totalBeats) + activeSong.totalBeats) % activeSong.totalBeats;
          let nextSectionEvent = null;
          for (let cycle = 0; cycle < 2 && !nextSectionEvent; cycle++) {
            const offset = cycle * activeSong.totalBeats;
            for (const event of activeSong.events) {
              const start = event.startBeat + offset;
              if (start <= beat) continue;
              if (event.section !== currentSection) {
                nextSectionEvent = {...event, beatsAway: start - beat};
                break;
              }
            }
          }

          if (nextSectionEvent) {
            const d = nextSectionEvent.beatsAway;

            if (d <= 4 && d > 0) {
              const progress = (4 - d) / 4;
              songSectionLabel.style.opacity = String(Math.max(0, 1 - progress));
            } else {
              songSectionLabel.style.opacity = '1';
            }

            incomingSectionLabel.textContent = '';
            incomingSectionLabel.className = 'incoming-section-label';

            if (d <= 8 && d > 0) {
              const discrete = Math.max(1, Math.min(8, Math.ceil(d)));
              const pct = ((discrete - 1) / 7) * 100;
              const incomingX = 42 + (pct / 100) * 58;

              incomingSectionLabel.textContent = nextSectionEvent.section;

              if (incomingX <= 50) {
                incomingSectionLabel.style.left = '50%';
                incomingSectionLabel.className = 'incoming-section-label visible waiting';
              } else {
                incomingSectionLabel.style.left = `${incomingX}%`;
                incomingSectionLabel.className = 'incoming-section-label visible';
              }
            }
          }

          chordLaneAnimationFrame = requestAnimationFrame(animate);
          return;
        }

        // Song 1 behavior
        const visualIndex =
          Math.floor(absoluteBeat / beatsPerMeasure) % SONG_MEASURES.length;

        if (visualIndex !== chordLaneVisualIndex) {
          renderChordLane(visualIndex, absoluteBeatPosition);
        }

        if (absoluteBeat !== chordLaneLastBeat) {
          chordLaneLastBeat = absoluteBeat;
          renderUpcomingRunway(absoluteBeatPosition);
        }

        const visibleSection = chordAt(visualIndex).section;
        const displayedSection = songSectionLabel.dataset.section;

        if (displayedSection !== visibleSection) {
          songSectionLabel.textContent = displaySectionName(visualIndex);
          songSectionLabel.dataset.section = visibleSection;
          songSectionLabel.style.opacity = '1';

          incomingSectionLabel.textContent = '';
          incomingSectionLabel.className = 'incoming-section-label';
          incomingSectionLabel.style.left = '100%';
        }

        const boundary = sectionBoundaryInfo(
          visualIndex,
          absoluteBeatPosition
        );

        if (boundary) {
          if (boundary.beatsUntil <= 4 && boundary.beatsUntil > 0) {
            const fadeProgress = (4 - boundary.beatsUntil) / 4;
            songSectionLabel.style.opacity =
              String(Math.max(0, 1 - fadeProgress));
          } else {
            songSectionLabel.style.opacity = '1';
          }

          if (boundary.beatsUntil <= 8 && boundary.beatsUntil > 0) {
            const incomingX = incomingTitleXForBeatsAway(
              boundary.beatsUntil
            );

            incomingSectionLabel.textContent =
              displaySectionName(boundary.nextIndex);

            if (incomingX <= 50) {
              incomingSectionLabel.style.left = '50%';
              incomingSectionLabel.className =
                'incoming-section-label visible waiting';
            } else {
              incomingSectionLabel.style.left = `${incomingX}%`;
              incomingSectionLabel.className =
                'incoming-section-label visible';
            }
          } else {
            incomingSectionLabel.textContent = '';
            incomingSectionLabel.className =
              'incoming-section-label';
            incomingSectionLabel.style.left = '100%';
          }
        }

        chordLaneAnimationFrame = requestAnimationFrame(animate);
      };

      chordLaneAnimationFrame = requestAnimationFrame(animate);

    /* ---------- Web Audio ---------- */

    async function ensureAudioContext() {
      if (!audioContext) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) throw new Error('Web Audio is not available.');
        audioContext = new AudioContextClass();
      }

      if (audioContext.state === 'suspended') {
        await audioContext.resume();
      }
    }

    function getNoiseBuffer() {
      if (noiseBuffer && noiseBuffer.sampleRate === audioContext.sampleRate) {
        return noiseBuffer;
      }

      const length = Math.round(audioContext.sampleRate * 0.35);
      noiseBuffer = audioContext.createBuffer(1, length, audioContext.sampleRate);
      const data = noiseBuffer.getChannelData(0);

      for (let i = 0; i < length; i++) {
        data[i] = Math.random() * 2 - 1;
      }

      return noiseBuffer;
    }

    /* ---------- Metronome sound ---------- */

    function playClick(time) {
      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();

      oscillator.frequency.value = 850;

      gain.gain.setValueAtTime(0.0001, time);
      gain.gain.exponentialRampToValueAtTime(
        Math.max(0.0001, 0.65 * metronomeVolumeLevel),
        time + 0.002
      );
      gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.055);

      oscillator.connect(gain);
      gain.connect(audioContext.destination);

      oscillator.start(time);
      oscillator.stop(time + 0.065);
    }

    /* ---------- Drum synthesis ---------- */

    function playKick(time, level = 1) {
      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();
      const peak = Math.max(0.0001, 0.50 * metronomeVolumeLevel * level);

      oscillator.type = 'sine';
      oscillator.frequency.setValueAtTime(135, time);
      oscillator.frequency.exponentialRampToValueAtTime(48, time + 0.11);

      gain.gain.setValueAtTime(peak, time);
      gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.18);

      oscillator.connect(gain);
      gain.connect(audioContext.destination);
      oscillator.start(time);
      oscillator.stop(time + 0.20);
    }

    function playSnare(time, level = 1) {
      const noise = audioContext.createBufferSource();
      const noiseFilter = audioContext.createBiquadFilter();
      const noiseGain = audioContext.createGain();
      const tone = audioContext.createOscillator();
      const toneGain = audioContext.createGain();
      const peak = Math.max(0.0001, 0.25 * metronomeVolumeLevel * level);

      noise.buffer = getNoiseBuffer();
      noiseFilter.type = 'highpass';
      noiseFilter.frequency.value = 1100;
      noiseGain.gain.setValueAtTime(peak, time);
      noiseGain.gain.exponentialRampToValueAtTime(0.0001, time + 0.12);

      tone.type = 'triangle';
      tone.frequency.value = 185;
      toneGain.gain.setValueAtTime(Math.max(0.0001, peak * 0.45), time);
      toneGain.gain.exponentialRampToValueAtTime(0.0001, time + 0.07);

      noise.connect(noiseFilter);
      noiseFilter.connect(noiseGain);
      noiseGain.connect(audioContext.destination);

      tone.connect(toneGain);
      toneGain.connect(audioContext.destination);

      noise.start(time);
      noise.stop(time + 0.14);
      tone.start(time);
      tone.stop(time + 0.09);
    }

    function playHat(time, level = 1, open = false) {
      const noise = audioContext.createBufferSource();
      const highpass = audioContext.createBiquadFilter();
      const gain = audioContext.createGain();
      const duration = open ? 0.16 : 0.045;
      const peak = Math.max(0.0001, 0.095 * metronomeVolumeLevel * level);

      noise.buffer = getNoiseBuffer();
      highpass.type = 'highpass';
      highpass.frequency.value = 6500;

      gain.gain.setValueAtTime(peak, time);
      gain.gain.exponentialRampToValueAtTime(0.0001, time + duration);

      noise.connect(highpass);
      highpass.connect(gain);
      gain.connect(audioContext.destination);

      noise.start(time);
      noise.stop(time + duration + 0.02);
    }

    function playTom(time, pitch = 0.5, level = 1) {
      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();
      const startFrequency = 185 - (pitch * 75);
      const endFrequency = Math.max(60, startFrequency * 0.62);
      const peak = Math.max(0.0001, 0.34 * metronomeVolumeLevel * level);

      oscillator.type = 'sine';
      oscillator.frequency.setValueAtTime(startFrequency, time);
      oscillator.frequency.exponentialRampToValueAtTime(endFrequency, time + 0.12);

      gain.gain.setValueAtTime(peak, time);
      gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.20);

      oscillator.connect(gain);
      gain.connect(audioContext.destination);
      oscillator.start(time);
      oscillator.stop(time + 0.22);
    }

      const peak = Math.max(0.0001, 0.22 * metronomeVolumeLevel);

      chordBus.gain.setValueAtTime(0.0001, time);
      chordBus.gain.exponentialRampToValueAtTime(peak, time + 0.025);

      chordBus.gain.exponentialRampToValueAtTime(0.0001, time + duration);

        if (measure) playChord(measure.chord, time);

        const currentAbsoluteBeat = song2ScheduledBeat % SONG2.totalBeats;
        const event = SONG2.events.find(e => e.startBeat === currentAbsoluteBeat);

        const currentAbsoluteBeat = song3ScheduledBeat % SONG3.totalBeats;

      if(m.n!==m.len || beat!==beatsPerMeasure) return;

      if(m.section==='Outro') {
        scheduleAtBeatFraction(time,.55,playTom,.72,.62);
      } else if(m.section==='Intro') {
        scheduleAtBeatFraction(time,.50,playSnare,.72);
        scheduleAtBeatFraction(time,.78,playTom,.58,.82);
      } else if(m.section==='Pre-Chorus') {
        [0,.25,.5,.75].forEach((f,i)=>scheduleAtBeatFraction(time,f,playSnare,.58+i*.12));
      } else if(m.section.startsWith('Verse')) {
        scheduleAtBeatFraction(time,0,playSnare,.70);

        scheduleAtBeatFraction(time,.78,playTom,.78,.90);
      } else if(m.section==='Bridge') {
        [0,.33,.66].forEach((f,i)=>scheduleAtBeatFraction(time,f,playTom,i*.45,.88+i*.05));

        'country-waltz':'beat3Snare',
        'jazz-waltz':'tripletRideSnare',
        'brush-waltz':'brushSweep',
        'half-34':'broadTom',
        'folk-waltz':'beat3Snare',
        'heavy-34':'descendingTom',
        'sync-34':'syncKickSnare'
      },
      '6/8': {
        'basic-68':'compoundTom',
        'rock-ballad-68':'compoundSnareTom',
        'blues-68':'tripletSnareTom',
        'shuffle-68':'tripletTom',
        'soul-68':'compoundSync',
        'gospel-68':'rollingFill',
        'half-68':'broadTom',
        'afro-cuban-68':'crossRhythm',
        'african-68':'crossTom',
        'march-68':'snareRoll'
      },
      '12/8': {
        'blues-128':'tripletSnareTom',
        'rock-ballad-128':'descendingTom',
        'slow-blues-128':'shortTriplet',
        'shuffle-128':'tripletSnareTom',
        'soul-128':'syncKickSnare',
        'gospel-128':'rollingFill',
        'rnb-128':'restrainedPickup',
        'half-128':'broadTom',
        'triplet-rock-128':'fullTripletTom',
        'afro-128':'crossRhythm'
      },
      '2/4': {
        'basic-24':'beat2Snare',
        'march-24':'snareRoll',
        polka:'doubleStroke',
        'country-two':'trainPickup',
        train:'accentedRoll',
        'fast-rock-24':'fastSnareTom',
        samba:'syncTom',
        baiao:'kickTomSync',
        frevo:'rapidSnare',
        'funk-24':'syncKickSnare'
      }
    };

    function scheduleAtBeatFraction(beatTime, fraction, player, ...args) {
      player(beatTime + secondsPerBeat() * fraction, ...args);
    }

    function scheduleTurnaroundBeat(beatTime, beatNumber, rhythm) {
      if (phraseMeasure !== 8 || !rhythm) return;

      const type = TURNAROUND_TYPES[currentTimeSignature]?.[rhythm.id];
      if (!type) return;

      const last = beatsPerMeasure;
      const penultimate = Math.max(1, beatsPerMeasure - 1);

      const onLast = () => beatNumber === last;
      const onPenultimate = () => beatNumber === penultimate;

      switch (type) {
        case 'tom8':
          if (onLast()) {
            scheduleAtBeatFraction(beatTime, 0.00, playTom, 0.15, 1.0);
            scheduleAtBeatFraction(beatTime, 0.50, playTom, 0.75, 1.0);
          }
          break;

        case 'snareBuild':
          if (onLast()) {
            [0, 0.25, 0.5, 0.75].forEach((f, i) =>
              scheduleAtBeatFraction(beatTime, f, playSnare, 0.65 + i * 0.12)
            );
            scheduleAtBeatFraction(beatTime, 0.88, playHat, 1.0, true);
          }
          break;

        case 'syncKickSnare':
          if (onLast()) {
            scheduleAtBeatFraction(beatTime, 0.00, playKick, 0.95);
            scheduleAtBeatFraction(beatTime, 0.38, playSnare, 0.85);
            scheduleAtBeatFraction(beatTime, 0.68, playKick, 0.85);
            scheduleAtBeatFraction(beatTime, 0.82, playSnare, 1.05);
          }
          break;

        case 'tripletSnareTom':
          if (onLast()) {
            scheduleAtBeatFraction(beatTime, 0.00, playSnare, 0.85);
            scheduleAtBeatFraction(beatTime, 1/3, playTom, 0.25, 0.95);
            scheduleAtBeatFraction(beatTime, 2/3, playTom, 0.78, 1.0);
          }
          break;

        case 'tom16':
        case 'descendingTom':
          if (onLast()) {
            [0.00, 0.25, 0.50, 0.75].forEach((f, i) =>
              scheduleAtBeatFraction(beatTime, f, playTom, i / 3, 0.95)
            );
          }
          break;

        case 'fastSnare':
        case 'rapidSnare':
          if (onLast()) {
            [0.00, 0.25, 0.50, 0.75].forEach((f, i) =>
              scheduleAtBeatFraction(beatTime, f, playSnare, 0.72 + i * 0.09)
            );
          }
          break;

        case 'openHatPickup':
          if (onLast()) {
            scheduleAtBeatFraction(beatTime, 0.50, playHat, 1.0, true);
            scheduleAtBeatFraction(beatTime, 0.75, playSnare, 1.0);
          }
          break;

        case 'rimTomPickup':
          if (onLast()) {
            scheduleAtBeatFraction(beatTime, 0.50, playSnare, 0.55);
            scheduleAtBeatFraction(beatTime, 0.78, playTom, 0.55, 0.85);
          }
          break;

        case 'tomKickPickup':
          if (onLast()) {
            scheduleAtBeatFraction(beatTime, 0.25, playTom, 0.30, 0.9);
            scheduleAtBeatFraction(beatTime, 0.55, playTom, 0.75, 0.9);
            scheduleAtBeatFraction(beatTime, 0.82, playKick, 1.0);
          }
          break;

        case 'crossStickPickup':
          if (onLast()) {
            scheduleAtBeatFraction(beatTime, 0.25, playSnare, 0.48);
            scheduleAtBeatFraction(beatTime, 0.72, playSnare, 0.58);
          }
          break;

        case 'beat3Snare':
        case 'beat2Snare':
          if (onLast()) {
            scheduleAtBeatFraction(beatTime, 0.50, playSnare, 0.9);
          }
          break;

        case 'beat3Tom':
          if (onLast()) {
            scheduleAtBeatFraction(beatTime, 0.00, playTom, 0.20, 0.9);
            scheduleAtBeatFraction(beatTime, 0.50, playTom, 0.72, 1.0);
          }
          break;

        case 'eighthSnareTom':
        case 'fastSnareTom':
          if (onLast()) {
            scheduleAtBeatFraction(beatTime, 0.00, playSnare, 0.85);
            scheduleAtBeatFraction(beatTime, 0.50, playTom, 0.68, 1.0);
          }
          break;

        case 'tripletRideSnare':
          if (onLast()) {
            scheduleAtBeatFraction(beatTime, 0.00, playHat, 0.8, true);
            scheduleAtBeatFraction(beatTime, 1/3, playSnare, 0.65);
            scheduleAtBeatFraction(beatTime, 2/3, playSnare, 0.9);
          }
          break;

        case 'brushSweep':
          if (onLast()) {
            [0.00, 0.33, 0.66].forEach((f, i) =>
              scheduleAtBeatFraction(beatTime, f, playSnare, 0.42 + i * 0.08)
            );
          }
          break;

        case 'broadTom':
          if (onPenultimate()) {
            scheduleAtBeatFraction(beatTime, 0.50, playTom, 0.15, 0.9);
          }
          if (onLast()) {
            scheduleAtBeatFraction(beatTime, 0.00, playTom, 0.50, 0.95);
            scheduleAtBeatFraction(beatTime, 0.66, playTom, 0.85, 1.0);
          }
          break;

        case 'compoundTom':
          if (onLast()) {
            [0.00, 0.33, 0.66].forEach((f, i) =>
              scheduleAtBeatFraction(beatTime, f, playTom, i / 2, 0.95)
            );
          }
          break;

        case 'compoundSnareTom':
          if (onLast()) {
            scheduleAtBeatFraction(beatTime, 0.00, playSnare, 0.85);
            scheduleAtBeatFraction(beatTime, 0.33, playTom, 0.35, 0.9);
            scheduleAtBeatFraction(beatTime, 0.66, playTom, 0.78, 1.0);
          }
          break;

        case 'tripletTom':
        case 'fullTripletTom':
          if (onLast()) {
            [0.00, 0.33, 0.66].forEach((f, i) =>
              scheduleAtBeatFraction(beatTime, f, playTom, i / 2, 1.0)
            );
          }
          break;

        case 'compoundSync':
          if (onLast()) {
            scheduleAtBeatFraction(beatTime, 0.00, playSnare, 0.75);
            scheduleAtBeatFraction(beatTime, 0.34, playKick, 0.9);
            scheduleAtBeatFraction(beatTime, 0.68, playTom, 0.65, 0.95);
          }
          break;

        case 'rollingFill':
          if (onPenultimate() || onLast()) {
            [0.00, 0.33, 0.66].forEach((f, i) => {
              const player = (beatNumber === last && i > 0) ? playTom : playSnare;
              if (player === playTom) {
                scheduleAtBeatFraction(beatTime, f, playTom, i * 0.45, 0.9);
              } else {
                scheduleAtBeatFraction(beatTime, f, playSnare, 0.65 + i * 0.08);
              }
            });
          }
          break;

        case 'crossRhythm':
          if (onPenultimate()) {
            scheduleAtBeatFraction(beatTime, 0.00, playTom, 0.15, 0.85);
            scheduleAtBeatFraction(beatTime, 0.66, playSnare, 0.7);
          }
          if (onLast()) {
            scheduleAtBeatFraction(beatTime, 0.33, playTom, 0.58, 0.95);
            scheduleAtBeatFraction(beatTime, 0.82, playKick, 1.0);
          }
          break;

        case 'crossTom':
          if (onPenultimate() || onLast()) {
            scheduleAtBeatFraction(beatTime, 0.00, playTom, beatNumber === last ? 0.55 : 0.15, 0.85);
            scheduleAtBeatFraction(beatTime, 0.66, playTom, beatNumber === last ? 0.90 : 0.42, 0.95);
          }
          break;

        case 'snareRoll':
        case 'accentedRoll':
          if (onLast()) {
            [0.00, 0.20, 0.40, 0.60, 0.80].forEach((f, i) =>
              scheduleAtBeatFraction(beatTime, f, playSnare, 0.58 + i * 0.08)
            );
          }
          break;

        case 'shortTriplet':
          if (onLast()) {
            scheduleAtBeatFraction(beatTime, 0.33, playSnare, 0.7);
            scheduleAtBeatFraction(beatTime, 0.66, playTom, 0.65, 0.9);
          }
          break;

        case 'restrainedPickup':
          if (onLast()) {
            scheduleAtBeatFraction(beatTime, 0.50, playSnare, 0.55);
            scheduleAtBeatFraction(beatTime, 0.82, playTom, 0.58, 0.65);
          }
          break;

        case 'doubleStroke':
          if (onLast()) {
            scheduleAtBeatFraction(beatTime, 0.58, playSnare, 0.72);
            scheduleAtBeatFraction(beatTime, 0.78, playSnare, 0.90);
          }
          break;

        case 'trainPickup':
          if (onLast()) {
            [0.25, 0.50, 0.75].forEach((f, i) =>
              scheduleAtBeatFraction(beatTime, f, playSnare, 0.58 + i * 0.12)
            );
          }
          break;

        case 'syncTom':
          if (onLast()) {
            scheduleAtBeatFraction(beatTime, 0.18, playTom, 0.15, 0.85);
            scheduleAtBeatFraction(beatTime, 0.55, playSnare, 0.72);
            scheduleAtBeatFraction(beatTime, 0.82, playTom, 0.75, 0.95);
          }
          break;

        case 'kickTomSync':
          if (onLast()) {
            scheduleAtBeatFraction(beatTime, 0.00, playKick, 0.95);
            scheduleAtBeatFraction(beatTime, 0.38, playTom, 0.28, 0.9);
            scheduleAtBeatFraction(beatTime, 0.72, playTom, 0.78, 1.0);
          }
          break;
      }
    }

    function scheduleInstrumentSteps(steps, subdivisions, beatIndex, beatTime, player, level = 1) {
      if (!steps) return;

      const subDuration = secondsPerBeat() / subdivisions;

      steps.forEach(step => {
        const eventBeatIndex = Math.floor(step / subdivisions);
        if (eventBeatIndex !== beatIndex) return;

        const localStep = step % subdivisions;
        player(beatTime + localStep * subDuration, level);
      });
    }

    function scheduleRhythmBeat(beatTime, beatNumber) {
      const rhythm = currentRhythm();
      if (!rhythm) return;

      const beatIndex = beatNumber - 1;
      const subdivisions = rhythm.subdivisions;

      scheduleInstrumentSteps(rhythm.kick, subdivisions, beatIndex, beatTime, playKick, 1);
      scheduleInstrumentSteps(rhythm.snare, subdivisions, beatIndex, beatTime, playSnare, 1);
      scheduleInstrumentSteps(rhythm.hat, subdivisions, beatIndex, beatTime, playHat, 0.85);

      if (rhythm.openHat) {
        scheduleInstrumentSteps(
          rhythm.openHat,
          subdivisions,
          beatIndex,
          beatTime,
          (time, level) => playHat(time, level, true),
          0.9
        );
      }

      scheduleAssemblyTurnaround(beatTime, beatNumber, rhythm);
    }

    /* ---------- Visual beat ---------- */

    function flashBeat(beatNumber, delayMs = 0) {
      setTimeout(() => {
        if (!running) return;

        const line = beatLines[(beatNumber - 1) % beatsPerMeasure];
        if (!line) return;

        if (beatNumber === 1) {
          measureClock.classList.add('downbeat-circle-flash');
        }

        line.classList.add('flash');

        setTimeout(() => {
          line.classList.remove('flash');
          if (beatNumber === 1) {
            measureClock.classList.remove('downbeat-circle-flash');
          }
        }, beatNumber === 1 ? 230 : 170);
      }, Math.max(0, delayMs));
    }

    function scheduleVisualAtBeat(scheduledTime, beatNumber) {
      const delayMs = Math.max(0, (scheduledTime - audioContext.currentTime) * 1000);
      flashBeat(beatNumber, delayMs);
    }

    /* ---------- Scheduler ---------- */

    function scheduleMetronome() {
      if (!running || !audioContext) return;

      const now = audioContext.currentTime;

      while (nextBeatTime < now + SCHEDULE_AHEAD_SECONDS) {
        const scheduledBeat = nextBeatNumber;

        playClick(nextBeatTime);
        scheduleSongChord(nextBeatTime, scheduledBeat);
        scheduleRhythmBeat(nextBeatTime, scheduledBeat);

        if (secondSongActive()) {
          song2ScheduledBeat = (song2ScheduledBeat + 1) % SONG2.totalBeats;
        }

        if (thirdSongActive()) {
          song3ScheduledBeat = (song3ScheduledBeat + 1) % SONG3.totalBeats;
        }
        scheduleVisualAtBeat(nextBeatTime, scheduledBeat);

        nextBeatTime += secondsPerBeat();

        if (nextBeatNumber === beatsPerMeasure) {
          phraseMeasure = phraseMeasure === 8 ? 1 : phraseMeasure + 1;
          if (songExperimentActive()) {
            songMeasureIndex = (songMeasureIndex + 1) % SONG_MEASURES.length;
          }
        }

        nextBeatNumber = (nextBeatNumber % beatsPerMeasure) + 1;
      }

      schedulerTimer = setTimeout(scheduleMetronome, SCHEDULER_INTERVAL_MS);
    }

    async function startMetronome() {
      await ensureAudioContext();
      if (running) return;

      running = true;
      nextBeatNumber = 1;
      phraseMeasure = 1;
      songMeasureIndex = 0;
      song2ScheduledBeat = 0;
      song3ScheduledBeat = 0;
      nextBeatTime = audioContext.currentTime + START_LATENCY_SECONDS;

      showStop();

      showClockHand();
      startClock(nextBeatTime);

      // Core metronome first; song visuals are optional.
      scheduleMetronome();

      try {
        startChordLaneAnimation(nextBeatTime);
      } catch (error) {
        console.error('Chord display could not start:', error);
      }
    }

    function stopMetronome() {
      running = false;

      if (schedulerTimer) {
        clearTimeout(schedulerTimer);
        schedulerTimer = null;
      }

      beatLines.forEach(line => line.classList.remove('flash'));
      measureClock.classList.remove('downbeat-circle-flash');

      stopClock();
      stopChordLaneAnimation();

      showPlay();
    }

    /* ---------- Measure clock ---------- */

    function showClockHand() {
      clockHand.classList.add('visible');
    }

    function hideClockHand() {
      clockHand.classList.remove('visible');
    }

    function startClock(anchorAudioTime) {
      clockAnchorTime = anchorAudioTime;

      if (clockAnimationFrame) {
        cancelAnimationFrame(clockAnimationFrame);
      }

      const animate = () => {
        if (!audioContext || clockAnchorTime == null || !running) {
          clockAnimationFrame = null;
          return;
        }

        const elapsed = audioContext.currentTime - clockAnchorTime;
        const measureDuration = secondsPerMeasure();
        const phase = ((elapsed % measureDuration) + measureDuration) % measureDuration;
        const degrees = (phase / measureDuration) * 360;

        clockHand.style.transform =
          `translate(-50%, -100%) rotate(${degrees}deg)`;

        clockAnimationFrame = requestAnimationFrame(animate);
      };

      clockAnimationFrame = requestAnimationFrame(animate);
    }

    function stopClock() {
      if (clockAnimationFrame) {
        cancelAnimationFrame(clockAnimationFrame);
      }

      clockAnimationFrame = null;
      clockAnchorTime = null;
      clockHand.style.transform = 'translate(-50%, -100%) rotate(0deg)';
      hideClockHand();
    }

    /* ---------- Event wiring ---------- */

    tempoSlider.addEventListener('input', () => {
      setTempo(tempoSlider.value);
    });

    tempoValue.addEventListener('change', () => {
      setTempo(tempoValue.value);
    });

    timeSignatureChoices.forEach(button => {
      button.addEventListener('click', event => {
        event.preventDefault();
        event.stopPropagation();
        setTimeSignature(button.dataset.signature, button.dataset.beats);
      });
    });

    metronomeVolume.addEventListener('input', () => {
      const value = Math.max(0, Math.min(100, Number(metronomeVolume.value)));
      metronomeVolumeLevel = value / 100;
      metronomeVolumeValue.textContent = `${Math.round(value)}%`;
    });

    drumRhythmButton.addEventListener('click', () => {
      setRhythmPickerVisible(!rhythmPickerVisible);
      if (!rhythmPicker.hidden) {
        rhythmSelect.focus({ preventScroll: true });
      }
    });

    rhythmSelect.addEventListener('change', () => {
      selectedRhythmBySignature[currentTimeSignature] = rhythmSelect.value;
      phraseMeasure = 1;
      songMeasureIndex = 0;
      song2ScheduledBeat = 0;
      song3ScheduledBeat = 0;
      updateDrumButton();
      renderChordLane(0);
    });

    metronomeToggle.addEventListener('click', async () => {
      if (running) {
        stopMetronome();
        return;
      }

      try {
        await startMetronome();
      } catch (error) {
        console.error('Metronome could not start:', error);
        stopMetronome();
      }
    });

    /* ---------- Initial state ---------- */

    showPlay();
    hideClockHand();
    setTempo(DEFAULT_BPM);
    setTimeSignature('4/4', 4);
    metronomeVolume.value = 100;
    metronomeVolumeLevel = 1.0;
    metronomeVolumeValue.textContent = '100%';
    setRhythmPickerVisible(false);
    renderChordLane(0);
    
  })();
  </script>
</body>
</html>
